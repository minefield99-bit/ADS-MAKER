name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # If the repo has a FAL_API_KEY secret, bake it into the APK so the app
      # works with zero setup (the in-app key screen then never appears; an
      # in-app key still overrides this). If the secret is absent — including
      # on pull requests from forks, which never receive secrets — this writes
      # an empty value and the app simply asks for a key, same as before.
      # NOTE: an APK built with the secret contains the owner's key. Share the
      # app-debug artifact only with people who may spend the owner's fal.ai
      # credit.
      - name: Inject fal.ai API key (optional secret)
        run: echo "FAL_API_KEY=${{ secrets.FAL_API_KEY }}" >> local.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
